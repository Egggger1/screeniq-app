<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏知 ScreenIQ</title>
<style>
/* ============================================================
   屏知 ScreenIQ · 设计系统
   借鉴 Material 3 Expressive / Material You 的设计语言：
   - 层次化 surface 色阶（靠色调分层，不靠阴影）
   - 大圆角、药丸形组件
   - 动态主题色（下面 JS 里可切换，surface 会跟着染上主色调）
   保留屏知自己的品牌青绿默认色 + 识屏入口。
   ============================================================ */
:root{
  --p:#A3E8D8; --op:#003831; --pc:#00564B; --opc:#BDF6E8;
  --s:#ACD0C5; --sc:#2A4E45; --osc:#C7EBDD;
  --t:#BBC8F2; --tc:#36426B;
  --surf:#0D1B19; --surfLow:#091312; --sc1:#172724; --sc2:#203330; --sc3:#29413D;
  --on:#DDE5E1; --onVar:#AEC5BE; --outline:#6F8B84;
  --danger:#FFB4AB; --warn:#FFD98F;
  --r-xl:32px; --r-lg:26px; --r-md:18px; --r-sm:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--surfLow); color:var(--on); height:100vh;
  display:flex; overflow:hidden; -webkit-font-smoothing:antialiased;
}
.icon{width:22px;height:22px;flex:0 0 auto}

/* ---------- 顶栏 ---------- */
header{
  position:fixed; top:0; left:0; right:0; height:68px; z-index:5;
  display:flex; align-items:center; gap:14px; padding:0 24px;
  background:color-mix(in srgb, var(--surf) 88%, transparent);
  backdrop-filter:blur(20px);
  border-bottom:1px solid color-mix(in srgb, var(--outline) 18%, transparent);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--p),var(--s)); color:var(--op);
  box-shadow:0 4px 18px color-mix(in srgb,var(--p) 30%,transparent);
}
.brand-mark .icon{width:22px;height:22px;stroke-width:2.2}
.brand-name{font-size:19px;font-weight:800;letter-spacing:.3px}
.brand-sub{font-size:10.5px;color:var(--onVar);letter-spacing:2px;margin-top:1px}
.spacer{flex:1}
.chip{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--sc2);border:1px solid color-mix(in srgb,var(--outline) 25%,transparent);
  color:var(--on);border-radius:999px;padding:9px 16px;font-size:13px;transition:.2s var(--ease);
}
.chip:hover{background:var(--sc3);transform:translateY(-1px)}
.chip .icon{width:17px;height:17px;color:var(--p)}
.chip b{font-weight:700;color:var(--p)}
.icon-btn{
  width:42px;height:42px;border-radius:14px;border:none;cursor:pointer;
  background:var(--sc2);color:var(--onVar);display:flex;align-items:center;justify-content:center;
  transition:.2s var(--ease);
}
.icon-btn:hover{background:var(--sc3);color:var(--p);transform:rotate(20deg)}

/* ---------- 主体 ---------- */
.app{display:flex;flex:1;padding-top:68px;min-height:0}
nav{
  width:248px;flex:0 0 248px;background:var(--surf);
  border-right:1px solid color-mix(in srgb,var(--outline) 15%,transparent);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;
}
.nav-item{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);
  cursor:pointer;color:var(--onVar);font-size:14px;font-weight:600;
  border:1px solid transparent;transition:.25s var(--ease);position:relative;
}
.nav-item .icon{width:21px;height:21px}
.nav-item:hover{background:var(--sc1);color:var(--on)}
.nav-item.active{
  background:var(--sc2);color:var(--p);
  border-color:color-mix(in srgb,var(--p) 25%,transparent);
}
.nav-item.active::before{
  content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);
  width:4px;height:26px;border-radius:4px;background:var(--p);
}
.nav-sep{height:1px;background:color-mix(in srgb,var(--outline) 18%,transparent);margin:14px 8px}
.nav-label{font-size:11px;color:var(--onVar);letter-spacing:1px;padding:0 16px 8px;text-transform:uppercase}
.side-card{
  margin-top:auto;padding:16px;border-radius:var(--r-md);
  background:linear-gradient(145deg,var(--sc2),var(--sc1));
  border:1px solid color-mix(in srgb,var(--p) 20%,transparent);
}
.side-card .tag{font-size:10px;color:var(--p);font-weight:700;letter-spacing:1px}
.side-card h4{font-size:13px;margin:6px 0 6px}
.side-card p{font-size:11px;color:var(--onVar);line-height:1.7}

/* ---------- 对话区 ---------- */
.content{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surfLow)}
.chat{flex:1;overflow-y:auto;padding:34px clamp(20px,6vw,80px)}
.wrap{max-width:840px;margin:0 auto}

/* 欢迎页 —— expressive hero */
.hero{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
.hero-art{position:relative;width:150px;height:150px;margin-bottom:26px}
.hero-blob{
  position:absolute;inset:0;border-radius:46% 54% 52% 48%/48% 45% 55% 52%;
  background:linear-gradient(145deg,var(--pc),var(--sc3));
  animation:morph 9s ease-in-out infinite;
}
@keyframes morph{
  0%,100%{border-radius:46% 54% 52% 48%/48% 45% 55% 52%;transform:rotate(0)}
  50%{border-radius:58% 42% 45% 55%/55% 58% 42% 45%;transform:rotate(12deg)}
}
.hero-eye{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--p)}
.hero-eye .icon{width:64px;height:64px;stroke-width:1.5}
.hero h1{font-size:30px;font-weight:800;margin-bottom:10px;letter-spacing:.5px}
.hero h1 span{color:var(--p)}
.hero p{font-size:14px;color:var(--onVar);line-height:1.9;max-width:520px}
.quick{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.quick button{
  background:var(--sc2);border:1px solid color-mix(in srgb,var(--p) 22%,transparent);
  color:var(--on);border-radius:999px;padding:11px 18px;font-size:12.5px;cursor:pointer;
  transition:.2s var(--ease);font-family:inherit;
}
.quick button:hover{background:var(--pc);color:var(--opc);transform:translateY(-2px)}

/* 消息 */
.msg{display:flex;gap:14px;margin-bottom:26px;animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.av{
  width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
  border-radius:13px;font-size:15px;font-weight:800;
}
.av.ai{background:linear-gradient(145deg,var(--p),var(--s));color:var(--op)}
.av.me{background:var(--sc3);color:var(--onVar)}
.av .icon{width:21px;height:21px;stroke-width:2.2}
.mbody{max-width:min(760px,84%);min-width:0}
.who{font-size:11.5px;color:var(--onVar);margin:2px 0 7px;font-weight:600}
.bubble{
  background:var(--sc1);border:1px solid color-mix(in srgb,var(--outline) 20%,transparent);
  border-radius:6px var(--r-lg) var(--r-lg) var(--r-lg);
  padding:16px 20px;font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
}
.msg.me{flex-direction:row-reverse}
.msg.me .mbody{display:flex;flex-direction:column;align-items:flex-end}
.msg.me .bubble{
  background:var(--pc);color:var(--opc);border-color:transparent;
  border-radius:var(--r-lg) 6px var(--r-lg) var(--r-lg);
}
.ocr-card{
  background:color-mix(in srgb,var(--sc3) 70%,transparent);
  border:1px solid color-mix(in srgb,var(--p) 30%,transparent);
  border-radius:var(--r-md);padding:12px 16px;margin-bottom:12px;
  font-size:12.5px;color:var(--onVar);line-height:1.7;
}
.ocr-card .tag{color:var(--p);font-weight:800;margin-right:8px}
.ocr-card img{max-height:180px;border-radius:var(--r-sm);margin-top:8px;display:block}
.note{
  margin-top:10px;font-size:12px;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 10%,transparent);
  border-radius:var(--r-sm);padding:9px 13px;
}
.thinking{color:var(--onVar);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--p);animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* ---------- 输入区 ---------- */
.dock{padding:12px clamp(20px,6vw,80px) 24px;background:linear-gradient(to top,var(--surfLow) 70%,transparent)}
.dock-wrap{max-width:840px;margin:0 auto}
.preview{
  display:none;align-items:center;gap:12px;background:var(--sc1);
  border:1px solid color-mix(in srgb,var(--p) 30%,transparent);
  border-radius:var(--r-md);padding:9px 12px;margin-bottom:10px;
}
.preview img{height:52px;border-radius:10px;object-fit:contain}
.preview span{flex:1;font-size:12px;color:var(--onVar)}
.preview button{background:none;border:none;color:var(--danger);cursor:pointer}
.inputbar{
  display:flex;align-items:flex-end;gap:6px;background:var(--sc2);
  border:1px solid color-mix(in srgb,var(--outline) 25%,transparent);
  border-radius:var(--r-xl);padding:8px 8px 8px 12px;
  transition:.2s var(--ease);
}
.inputbar:focus-within{border-color:color-mix(in srgb,var(--p) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 12%,transparent)}
.ib-btn{
  width:44px;height:44px;flex:0 0 44px;border-radius:15px;border:none;cursor:pointer;
  background:transparent;color:var(--onVar);display:flex;align-items:center;justify-content:center;
  transition:.2s var(--ease);
}
.ib-btn:hover{background:var(--sc3);color:var(--p)}
textarea{
  flex:1;background:transparent;border:none;outline:none;resize:none;
  color:var(--on);font-size:14.5px;font-family:inherit;line-height:1.6;
  min-height:44px;max-height:130px;padding:11px 2px;
}
textarea::placeholder{color:color-mix(in srgb,var(--onVar) 60%,transparent)}
.send{
  width:46px;height:46px;flex:0 0 46px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--p),var(--s));color:var(--op);
  display:flex;align-items:center;justify-content:center;transition:.2s var(--ease);
  box-shadow:0 4px 14px color-mix(in srgb,var(--p) 25%,transparent);
}
.send:hover{transform:scale(1.06)}
.send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hint{text-align:center;font-size:11px;color:color-mix(in srgb,var(--onVar) 65%,transparent);margin-top:10px}
#fileInput{display:none}

/* ---------- 解释开关（Material 3 过滤芯片风格） ---------- */
.toolrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 9px}
.explain-chip{
  display:inline-flex;align-items:center;gap:8px;border-radius:999px;cursor:pointer;
  padding:7px 15px;font:inherit;font-size:12.5px;font-weight:700;transition:.2s var(--ease);
  border:1px solid color-mix(in srgb,var(--outline) 45%,transparent);
  background:transparent;color:var(--onVar);white-space:nowrap;
}
.explain-chip:hover{background:color-mix(in srgb,var(--p) 10%,transparent)}
.explain-chip .sw{width:15px;height:15px;flex:0 0 15px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center}
.explain-chip.on{background:color-mix(in srgb,var(--p) 20%,transparent);border-color:var(--p);color:var(--p)}
.explain-chip.on .sw{background:var(--p);border-color:var(--p)}
.explain-chip.on .sw::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--op)}
.toolrow .tip{font-size:11px;color:color-mix(in srgb,var(--onVar) 60%,transparent);text-align:right}
.math{font-family:"Cambria Math",Georgia,serif;font-style:italic;color:var(--p);padding:0 2px}
.mathb{display:block;font-family:"Cambria Math",Georgia,serif;color:var(--p);margin:6px 0;
  background:color-mix(in srgb,var(--p) 8%,transparent);border-radius:8px;padding:6px 10px;overflow-x:auto}
.bubble strong{color:var(--p);font-weight:800}

/* ---------- 设置弹窗 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
  align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(6px);
}
.sheet{
  width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;
  background:var(--surf);border:1px solid color-mix(in srgb,var(--outline) 25%,transparent);
  border-radius:var(--r-xl);padding:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.5);animation:sheetIn .3s var(--ease);
}
@keyframes sheetIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.sheet h3{font-size:21px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:9px}
.sheet .desc{font-size:12.5px;color:var(--onVar);line-height:1.7;margin-bottom:22px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--onVar);margin-bottom:8px;font-weight:600}
select,input[type=password]{
  width:100%;background:var(--sc1);border:1px solid color-mix(in srgb,var(--outline) 30%,transparent);
  border-radius:var(--r-sm);padding:13px 14px;color:var(--on);font-size:14px;
  font-family:inherit;outline:none;transition:.2s var(--ease);
}
select:focus,input:focus{border-color:var(--p)}
.sub{font-size:11px;color:var(--onVar);margin-top:7px;line-height:1.6}
.sub a{color:var(--p);text-decoration:none}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme-dot{
  width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  transition:.2s var(--ease);position:relative;
}
.theme-dot:hover{transform:scale(1.1)}
.theme-dot.sel{border-color:var(--on);box-shadow:0 0 0 2px var(--surf) inset}
.theme-dot::after{content:attr(data-name);position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--onVar);white-space:nowrap;opacity:0;transition:.2s;pointer-events:none}
.theme-dot:hover::after{opacity:1}
.status{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--onVar);
  background:var(--sc1);border-radius:var(--r-sm);padding:11px 14px;margin-top:4px;
}
.status .d{width:9px;height:9px;border-radius:50%;background:var(--onVar)}
.status .d.on{background:var(--p);box-shadow:0 0 10px var(--p)}
.actions{display:flex;gap:10px;margin-top:24px}
.btn{
  flex:1;padding:13px;border-radius:var(--r-sm);border:1px solid color-mix(in srgb,var(--outline) 30%,transparent);
  background:var(--sc2);color:var(--on);font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;
  transition:.2s var(--ease);
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--p);color:var(--op);border-color:transparent}
.divider{height:1px;background:color-mix(in srgb,var(--outline) 18%,transparent);margin:4px 0 20px}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--sc3);border-radius:9px;border:2px solid var(--surfLow)}
@media(max-width:760px){
  nav{width:72px;flex-basis:72px;padding:18px 10px}
  .nav-item span.txt,.nav-label,.side-card{display:none}
  .nav-item{justify-content:center;padding:14px}
  .nav-item.active::before{left:-10px}
  .toolrow .tip{display:none}
}
</style>
</head>

<header>
  <div class="brand">
    <div class="brand-mark"><svg class="icon"><use href="#i-scan"/></svg></div>
    <div>
      <div class="brand-name">屏知 <span style="color:var(--p)">ScreenIQ</span></div>
      <div class="brand-sub">SCREEN · READ · ANSWER</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="chip" onclick="openSettings()">
    <svg class="icon"><use href="#i-spark"/></svg><b id="modelName">加载中…</b>
  </div>
  <button class="icon-btn" onclick="openSettings()" title="设置"><svg class="icon"><use href="#i-settings"/></svg></button>
</header>

<div class="app">
  <nav>
    <div class="nav-item active" id="tabOcr" onclick="setMode('ocr')">
      <svg class="icon"><use href="#i-scan"/></svg><span class="txt">识屏答题</span>
    </div>
    <div class="nav-item" id="tabChat" onclick="setMode('chat')">
      <svg class="icon"><use href="#i-chat"/></svg><span class="txt">自由聊天</span>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-label">屏知特性</div>
    <div class="nav-item" style="cursor:default">
      <svg class="icon"><use href="#i-spark"/></svg><span class="txt">答案在眼前</span>
    </div>
    <div class="side-card">
      <div class="tag">◈ 为备考而生</div>
      <h4>拍下题目，就地解答</h4>
      <p>备考刷题、执法考试、专业课难题——不用截屏切来切去，答案就在眼前。</p>
    </div>
  </nav>

  <div class="content">
    <div class="chat" id="chat">
      <div class="wrap">
        <div class="hero" id="hero">
          <div class="hero-art">
            <div class="hero-blob"></div>
            <div class="hero-eye"><svg class="icon"><use href="#i-scan"/></svg></div>
          </div>
          <h1>你好，我是 <span>屏知</span></h1>
          <p id="heroDesc">把屏幕上看到的题目拍给我，我读出文字、给出解答。<br>不用截屏、不用切来切去，答案就在眼前。</p>
          <div class="quick">
            <button onclick="quickAsk('upload')">📷 上传题目图片</button>
            <button onclick="quickAsk('1+1等于几？')">试试问一道题</button>
          </div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="dock-wrap">
        <div class="preview" id="preview">
          <img id="previewImg" src="">
          <span id="previewName">已选择图片</span>
          <button onclick="clearImage()" title="移除">✕</button>
        </div>
        <div class="toolrow">
          <button class="explain-chip on" id="explainChip" onclick="toggleExplain()" title="切换是否给出解题步骤">
            <span class="sw"></span><span id="explainLabel">详细解释 · 开</span>
          </button>
          <span class="tip" id="explainTip">当前：答案 + 解题步骤</span>
        </div>
        <div class="inputbar">
          <button class="ib-btn" onclick="document.getElementById('fileInput').click()" title="上传题目图片"><svg class="icon"><use href="#i-image"/></svg></button>
          <input type="file" id="fileInput" accept="image/*">
          <textarea id="question" rows="1" placeholder="输入问题，或上传题目截图后直接点发送…"></textarea>
          <button class="send" id="sendBtn" onclick="send()" title="发送"><svg class="icon"><use href="#i-send"/></svg></button>
        </div>
        <div class="hint" id="hint">识屏答题模式：上传图片会自动识字；也可直接打字提问</div>
      </div>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="settings">
  <div class="sheet">
    <h3><svg class="icon" style="color:var(--p)"><use href="#i-settings"/></svg> 设置</h3>
    <div class="desc">填入你自己的 API 密钥即可用真实模型答题。密钥只存本机、不上传；没填则自动用假答题演示。</div>

    <div class="field">
      <label>主题色（Material You 动态取色）</label>
      <div class="themes" id="themes"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>选择模型</label>
      <select id="providerSel" onchange="onProviderChange()"></select>
      <div class="sub" id="providerNote"></div>
    </div>

    <div class="field">
      <label>API 密钥</label>
      <input type="password" id="apiKey" placeholder="粘贴你的 API Key">
      <div class="sub" id="keyStatus"></div>
      <div class="sub" id="getKey"></div>
    </div>

    <div class="status"><span class="d" id="statusDot"></span><span id="statusText">未配置</span></div>

    <div class="actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
/* ========== 安卓桥接适配层 ==========
   电脑版业务代码用 fetch('/api/xxx') 调本地服务器；
   安卓版没有服务器，这里把 fetch 接到 window.ScreenIQ（Kotlin 桥接），
   下面的业务逻辑一行都不用改。 */
(function(){
  const B = window.ScreenIQ;
  window.__screeniq = true;  // 标记：这是安卓版
  window.fetch = function(url, opts){
    opts = opts || {};
    function ok(data){ return Promise.resolve({ ok:true, status:200, json:()=>Promise.resolve(data) }); }
    if(url.indexOf('/api/providers') === 0){
      return ok(JSON.parse(B.listProviders()));
    }
    if(url.indexOf('/api/config') === 0){
      if((opts.method||'GET').toUpperCase() === 'POST'){
        const d = JSON.parse(opts.body||'{}');
        return ok(JSON.parse(B.saveConfig(d.provider||'', d.api_key||'', d.base_url||'', d.model||'')));
      }
      return ok(JSON.parse(B.getConfig()));
    }
    if(url.indexOf('/api/answer') === 0){
      const d = JSON.parse(opts.body||'{}');
      return new Promise(resolve=>{
        // 原生异步识别+答题，完成后回调这个函数
        window.__onAnswer = function(data){ resolve({ ok:true, status:200, json:()=>Promise.resolve(data) }); };
        B.answer(d.image||'', d.question||'', !!d.explain, '__onAnswer');
      });
    }
    return Promise.reject(new Error('安卓版不支持该请求: '+url));
  };
})();

/* ========== Material You 主题（借鉴 RikkaHub 的设计语言） ========== */
const THEMES = {
  teal:{name:'青绿',p:'#A3E8D8',op:'#003831',pc:'#00564B',opc:'#BDF6E8',s:'#ACD0C5',sc:'#2A4E45',osc:'#C7EBDD',t:'#BBC8F2',tc:'#36426B',surf:'#0D1B19',surfLow:'#091312',sc1:'#172724',sc2:'#203330',sc3:'#29413D',on:'#DDE5E1',onVar:'#AEC5BE',outline:'#6F8B84',dot:'#17C3B2'},
  purple:{name:'幽紫',p:'#D0BCFF',op:'#381E72',pc:'#4F378B',opc:'#EADDFF',s:'#CCC2DC',sc:'#4A4458',osc:'#E8DEF8',t:'#EFB8C8',tc:'#633B48',surf:'#1B1620',surfLow:'#131017',sc1:'#2A2331',sc2:'#372F3F',sc3:'#433B4C',on:'#E6E1E9',onVar:'#CAC4D0',outline:'#8E8299',dot:'#9A7BE8'},
  blue:{name:'靛蓝',p:'#AECBFA',op:'#0A305F',pc:'#284A79',opc:'#D7E3FF',s:'#B8C7E0',sc:'#39465F',osc:'#DAE2F3',t:'#F0B8C8',tc:'#5C3644',surf:'#0E1722',surfLow:'#0A111A',sc1:'#192636',sc2:'#243346',sc3:'#2F4054',on:'#DCE3EC',onVar:'#AFC0D2',outline:'#71869B',dot:'#5B93E8'},
  orange:{name:'暖橙',p:'#FFB787',op:'#5C2E00',pc:'#8A4A0B',opc:'#FFDCC0',s:'#E8C2A5',sc:'#5A3D29',osc:'#FFDAC5',t:'#B8CADA',tc:'#344A5A',surf:'#1D1712',surfLow:'#14100C',sc1:'#2D241C',sc2:'#3B3025',sc3:'#4A3C2E',on:'#EFE4DA',onVar:'#D0BFAC',outline:'#948270',dot:'#F5913C'}
};
let theme='teal';
function applyTheme(id){
  theme=id; const t=THEMES[id]; const r=document.documentElement.style;
  const map={p:'--p',op:'--op',pc:'--pc',opc:'--opc',s:'--s',sc:'--sc',osc:'--osc',t:'--t',tc:'--tc',
    surf:'--surf',surfLow:'--surfLow',sc1:'--sc1',sc2:'--sc2',sc3:'--sc3',on:'--on',onVar:'--onVar',outline:'--outline'};
  for(const k in map) r.setProperty(map[k], t[k]);
  try{localStorage.setItem('screeniq_theme',id)}catch(e){}
  renderDots();
}
function renderDots(){
  const box=document.getElementById('themes');
  box.innerHTML=Object.keys(THEMES).map(id=>`<div class="theme-dot ${id===theme?'sel':''}" style="background:${THEMES[id].dot}" data-name="${THEMES[id].name}" onclick="applyTheme('${id}')"></div>`).join('');
}

/* ========== 状态 ========== */
let mode='ocr', imageData=null, providers=[], busy=false, explain=true;

/* 详细解释开关：状态存本地，下次打开还记得 */
function toggleExplain(){
  explain=!explain;
  document.getElementById('explainChip').classList.toggle('on',explain);
  document.getElementById('explainLabel').textContent=explain?'详细解释 · 开':'详细解释 · 关';
  document.getElementById('explainTip').textContent=explain?'当前：答案 + 解题步骤':'当前：只给答案，方便快速对答案';
  try{localStorage.setItem('screeniq_explain',explain?'1':'0')}catch(e){}
}

async function init(){
  try{const saved=localStorage.getItem('screeniq_theme'); if(saved&&THEMES[saved]) applyTheme(saved);}catch(e){}
  try{const se=localStorage.getItem('screeniq_explain'); if(se==='0'&&explain) toggleExplain();}catch(e){}
  renderDots();
  const r=await fetch('/api/providers').then(x=>x.json());
  providers=r.providers;
  document.getElementById('providerSel').innerHTML=providers.map(p=>`<option value="${p.id}">${p.name} — ${p.note}</option>`).join('');
  const c=await fetch('/api/config').then(x=>x.json());
  document.getElementById('modelName').textContent=(providers.find(p=>p.id===c.provider)?.name||c.provider)+(c.has_key?'':' (未配置)');
  document.getElementById('providerSel').value=c.provider;
  document.getElementById('keyStatus').textContent=c.has_key?('当前已保存：'+c.api_key_masked+'（留空则保持不变）'):'尚未保存密钥';
  document.getElementById('statusDot').className='d'+(c.has_key?' on':'');
  document.getElementById('statusText').textContent=c.has_key?'已配置真实模型':'未配置，将使用假答题演示';
  onProviderChange();
}
function onProviderChange(){
  const p=providers.find(x=>x.id===document.getElementById('providerSel').value);
  if(!p) return;
  document.getElementById('providerNote').textContent=p.note;
  document.getElementById('getKey').innerHTML=`没有密钥？<a href="${p.get_key_url}" target="_blank">去这里免费申请 →</a>`;
}
function setMode(m){
  mode=m;
  document.getElementById('tabOcr').classList.toggle('active',m==='ocr');
  document.getElementById('tabChat').classList.toggle('active',m==='chat');
  const hint=document.getElementById('hint');
  if(m==='ocr'){
    document.getElementById('heroDesc').innerHTML='把屏幕上看到的题目拍给我，我读出文字、给出解答。<br>不用截屏、不用切来切去，答案就在眼前。';
    hint.textContent='识屏答题模式：上传图片会自动识字；也可直接打字提问';
    document.getElementById('question').placeholder='输入问题，或上传题目截图后直接点发送…';
  }else{
    document.getElementById('heroDesc').innerHTML='直接输入问题和我聊天。<br>填好密钥后由真实模型回答，支持连续对话。';
    hint.textContent='自由聊天模式：直接打字对话';
    document.getElementById('question').placeholder='输入你想问的问题…';
  }
}
function quickAsk(t){
  if(t==='upload'){document.getElementById('fileInput').click();return;}
  document.getElementById('question').value=t; send();
}

/* ========== 图片 ========== */
document.getElementById('fileInput').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    imageData=ev.target.result;
    document.getElementById('previewImg').src=imageData;
    document.getElementById('previewName').textContent=f.name;
    document.getElementById('preview').style.display='flex';
    if(mode!=='ocr') setMode('ocr');
    const h=document.getElementById('hero'); if(h) h.remove();
  };
  reader.readAsDataURL(f);
});
function clearImage(){
  imageData=null;
  document.getElementById('preview').style.display='none';
  document.getElementById('fileInput').value='';
}

/* ========== 发送 ========== */
async function send(){
  if(busy) return;
  const q=document.getElementById('question').value.trim();
  if(!q&&!imageData){alert('请输入问题或上传图片');return;}
  busy=true; document.getElementById('sendBtn').disabled=true;
  const h=document.getElementById('hero'); if(h) h.remove();

  const userText=imageData?(q||'（上传了一张题目图片）'):q;
  addMsg('me',userText,null,null,imageData);
  const wait=addMsg('ai','',null,null,null,true);
  document.getElementById('question').value='';
  const imgToSend=imageData; clearImage();

  try{
    const r=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imgToSend,question:q,explain:explain})}).then(x=>x.json());
    wait.remove();
    addMsg('ai',r.answer||'（没有答案）',r.model,r.note,null,false,r.ocr_text,r.ocr_engine);
  }catch(err){
    wait.remove();
    addMsg('ai','请求失败：'+err.message+'（确认服务还在运行）',null,null,null,false,null,null,true);
  }finally{busy=false;document.getElementById('sendBtn').disabled=false;}
}

function addMsg(who,text,model,note,img,waiting,ocrText,ocrEngine,isWarn){
  const wrap=document.querySelector('#chat .wrap');
  const el=document.createElement('div'); el.className='msg '+(who==='me'?'me':'ai');
  const av=who==='me'?'我':'<svg class="icon"><use href="#i-spark"/></svg>';
  let h=`<div class="av ${who==='me'?'me':'ai'}">${av}</div><div class="mbody">`;
  h+=`<div class="who">${who==='me'?'我':(model||'屏知')}</div>`;
  if(ocrText) h+=`<div class="ocr-card"><span class="tag">识别到</span>${esc(ocrText)}${ocrEngine?` <span style="opacity:.6">· ${ocrEngine}</span>`:''}${img?`<img src="${img}">`:''}</div>`;
  else if(img) h+=`<div class="ocr-card"><img src="${img}"></div>`;
  if(waiting) h+=`<div class="bubble"><div class="thinking"><span>思考中</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  else h+=`<div class="bubble">${fmt(text)}</div>`;
  if(note&&!waiting) h+=`<div class="note">⚠ ${esc(note)}</div>`;
  h+=`</div>`; el.innerHTML=h; wrap.appendChild(el);
  const chat=document.getElementById('chat'); chat.scrollTop=chat.scrollHeight;
  return el;
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* 轻量排版：先转义保安全，再把模型常吐的 **加粗** 和 \(公式\) 显示好看 */
function fmt(s){
  if(s==null) return '';
  return esc(s)
    .replace(/\\\[([\s\S]*?)\\\]/g,'<span class="mathb">$1</span>')
    .replace(/\\\(([\s\S]*?)\\\)/g,'<span class="math">$1</span>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}

/* ========== 设置弹窗 ========== */
function openSettings(){
  document.getElementById('settings').style.display='flex';
  fetch('/api/config').then(x=>x.json()).then(c=>{
    document.getElementById('providerSel').value=c.provider;
    document.getElementById('keyStatus').textContent=c.has_key?('当前已保存：'+c.api_key_masked+'（留空则保持不变）'):'尚未保存密钥';
    onProviderChange();
  });
}
function closeSettings(){document.getElementById('settings').style.display='none';}
async function saveSettings(){
  const data={provider:document.getElementById('providerSel').value,api_key:document.getElementById('apiKey').value.trim()};
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  document.getElementById('apiKey').value='';
  await init(); closeSettings();
}
document.getElementById('question').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
init();
</script>
</body>
</html>
